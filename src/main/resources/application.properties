spring.application.name=HW4
server.port=0

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=1996

spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=10
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.resilience4j.enabled=true
resilience4j.circuitbreaker.instances.HW5.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.HW5.sliding-window-size=10
resilience4j.circuitbreaker.instances.HW5.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.HW5.permitted-number-of-calls-in-half-open-state=3

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO